name: Build KD Stream Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      KD_TEST_PLAYLIST: ${{ secrets.KD_TEST_PLAYLIST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q KDStream-Large-Playlist.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Prepare platform files
        working-directory: KDStream
        run: python3 tool/bootstrap.py

      - name: Install dependencies
        working-directory: KDStream
        run: flutter pub get

      - name: Analyze project
        working-directory: KDStream
        run: flutter analyze

      - name: Run tests
        working-directory: KDStream
        run: flutter test

      - name: Build APK
        working-directory: KDStream
        run: flutter build apk --release --dart-define=KD_TEST_PLAYLIST="$KD_TEST_PLAYLIST"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KD-Stream-Android-Test
          path: KDStream/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      KD_TEST_PLAYLIST: ${{ secrets.KD_TEST_PLAYLIST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q KDStream-Large-Playlist.zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Prepare platform files
        working-directory: KDStream
        run: python3 tool/bootstrap.py

      - name: Install dependencies
        working-directory: KDStream
        run: flutter pub get

      - name: Build iOS
        working-directory: KDStream
        run: flutter build ios --release --no-codesign --dart-define=KD_TEST_PLAYLIST="$KD_TEST_PLAYLIST"

      - name: Package unsigned IPA
        working-directory: KDStream
        run: |
          mkdir -p build/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned/Payload/
          cd build/unsigned
          zip -qr KD-Stream-Test-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KD-Stream-iOS-Test-unsigned
          path: KDStream/build/unsigned/KD-Stream-Test-unsigned.ipa
          if-no-files-found: error
